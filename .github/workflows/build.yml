name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Keystore (cria se faltar)
        run: |
          if [ ! -f app/save-pictures.jks ]; then
            keytool -genkeypair -keystore app/save-pictures.jks -alias savepictures -storepass savepictures123 -keypass savepictures123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Save Pictures, O=org.save.pictures"
          fi
      - run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Save-Pictures-apk
          path: app/build/outputs/apk/release/*.apk
